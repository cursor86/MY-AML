[project]
name = "finance-rl"
version = "0.1.0"
description = "Gymnasium environment modeling CFO capital-allocation decisions"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
